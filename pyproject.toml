[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "postflight"
version = "1.0.0"
description = "Decode and analyse Betaflight blackbox flight logs from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ItsMrZxD" }]
keywords = ["betaflight", "blackbox", "fpv", "drone", "flight-log", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
postflight = "postflight.cli:main"

[project.urls]
Homepage = "https://github.com/ItsMrZxD/postflight"
Issues = "https://github.com/ItsMrZxD/postflight/issues"

[tool.setuptools.packages.find]
include = ["postflight*"]

[tool.ruff]
line-length = 92
target-version = "py39"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "C4",  # comprehensions
    "RET", # return statements
    "SIM", # simplifications
]
ignore = [
    "SIM108", # a ternary is not always clearer than an if/else
    "RET505", # else-after-return reads fine when the branches are parallel
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
